<nav class="flex flex-wrap items-center justify-between gap-4 rounded-2xl bg-[#355834] px-6 py-4 shadow-md">


  <a routerLink="/dashboard" class="text-2xl font-extrabold tracking-tight text-white transition hover:text-[#e4c5c5]">
    TripHub
  </a>

  <div class="flex flex-wrap items-center gap-2 sm:gap-4">
    <a routerLink="/dashboard/trip"
      routerLinkActive="bg-white/20"
      class="rounded-lg px-3 py-2 text-sm font-medium text-white transition hover:bg-white/10">
      Mis viajes
    </a>

    <a routerLink="/dashboard/schedule"
      routerLinkActive="bg-white/20"
      class="rounded-lg px-3 py-2 text-sm font-medium text-white transition hover:bg-white/10">
      Calendario
    </a>

    <a routerLink="/dashboard/destination"
      routerLinkActive="bg-white/20"
      class="rounded-lg px-3 py-2 text-sm font-medium text-white transition hover:bg-white/10">
      Destinos
    </a>

    <a routerLink="/dashboard/statistics"
      routerLinkActive="bg-white/20"
      class="rounded-lg px-3 py-2 text-sm font-medium text-white transition hover:bg-white/10">
      Estadísticas
    </a>
  </div>


<div class="relative">
  <!-- Botón del usuario -->
  <button
    type="button"
    (click)="menuAbierto.set(!menuAbierto())"
    class="flex items-center justify-center rounded-full p-2 text-white transition hover:bg-white/20"
    aria-label="Abrir menú de usuario"
    [attr.aria-expanded]="menuAbierto()"
  >
    <svg xmlns="http://www.w3.org/2000/svg"
      width="30" height="30" viewBox="0 0 24 24">
      <path d="M0 0h24v24H0z" fill="none" />
      <path
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M12.16 10.87c-.1-.01-.22-.01-.33 0a4.42 4.42 0 0 1-4.27-4.43C7.56 3.99 9.54 2 12 2a4.435 4.435 0 0 1 .16 8.87m-5 3.69c-2.42 1.62-2.42 4.26 0 5.87c2.75 1.84 7.26 1.84 10.01 0c2.42-1.62 2.42-4.26 0-5.87c-2.74-1.83-7.25-1.83-10.01 0"
      />
    </svg>
  </button>

  <!-- Menú desplegable -->
  @if (menuAbierto()) {
    <div class="absolute right-0 top-full z-50 mt-2 w-52 rounded-xl border border-[#C2A878]/50 bg-white py-2 shadow-lg">

      <a
        routerLink="/dashboard/profile"
        (click)="menuAbierto.set(false)"
        class="block px-4 py-2 text-[#14281D] transition hover:bg-[#F1F5F2]"
      >
        Mi perfil
      </a>

      <button
        type="button"
        (click)="cerrarSesion()"
        class="block w-full px-4 py-2 text-left text-red-700 transition hover:bg-red-50"
      >
        Cerrar sesión
      </button>

    </div>
  }
</div>


</nav>
